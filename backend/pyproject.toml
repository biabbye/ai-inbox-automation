[project]
name = "supportflow-ai-backend"
version = "0.1.0"
description = "SupportFlow AI FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.3",
    "sqlalchemy[asyncio]>=2.1.8",
    "uvicorn[standard]>=0.54.0",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [

    "pytest>=9.2.0",
]
